name: Nexa Browser - Android ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build Nexa Browser v0.2 branding
        shell: bash
        run: |
          set -euo pipefail
          VERSION="153.0.8010.37"
          IMAGE="uazo/chromium:${VERSION}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/cromite-source"

          git clone --depth 1 https://github.com/uazo/cromite.git "$GITHUB_WORKSPACE/cromite-source"

          # Keep the normal Android MediaDrm preprovisioning path.
          sed -i '/^Disable-DRM-media-origin-IDs-preprovisioning\.patch$/d' \
            "$GITHUB_WORKSPACE/cromite-source/build/cromite_patches_list.txt"

          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/cromite-source:/home/lg/working_dir/cromite" \
            -v "$GITHUB_WORKSPACE/artifacts:/output" \
            -v "$GITHUB_WORKSPACE/build-drm.sh:/home/lg/build-drm.sh:ro" \
            -v "$GITHUB_WORKSPACE/branding:/home/lg/working_dir/cromite/branding:ro" \
            "$IMAGE" bash /home/lg/build-drm.sh

      - name: Verify branding outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/NexaBrowser-ARM64-debug.apk
          test "$(cat artifacts/NexaBrowser-name.txt)" = "Nexa Browser"
          test "$(cat artifacts/NexaBrowser-package.txt)" = "com.nexa.browser"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaBrowser-v0.2-Android-ARM64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
