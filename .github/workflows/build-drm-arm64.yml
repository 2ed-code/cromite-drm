name: Custom Chromium Browser - Android ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build v0.1 foundation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="153.0.8010.37"
          IMAGE="uazo/chromium:${VERSION}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/cromite-source"

          git clone --depth 1 https://github.com/uazo/cromite.git "$GITHUB_WORKSPACE/cromite-source"

          # Keep the normal Android MediaDrm preprovisioning path.
          sed -i '/^Disable-DRM-media-origin-IDs-preprovisioning\.patch$/d' \
            "$GITHUB_WORKSPACE/cromite-source/build/cromite_patches_list.txt"

          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/cromite-source:/home/lg/working_dir/cromite" \
            -v "$GITHUB_WORKSPACE/artifacts:/output" \
            -v "$GITHUB_WORKSPACE/build-drm.sh:/home/lg/build-drm.sh:ro" \
            "$IMAGE" bash /home/lg/build-drm.sh

      - name: Rename initial artifact
        shell: bash
        run: |
          set -euo pipefail
          mv artifacts/Cromite-ARM64-DRM-debug.apk artifacts/CustomChromium-v0.1.0-ARM64-DRM-debug.apk
          printf '0.1.0\n' > artifacts/CustomChromium-version.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomChromium-v0.1.0-Android-ARM64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
