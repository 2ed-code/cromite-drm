name: Cromite Android ARM64 - official DRM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    steps:
      - name: Checkout DRM build repository
        uses: actions/checkout@v4

      - name: Build Cromite with Android DRM restored
        shell: bash
        run: |
          set -eo pipefail

          VERSION="153.0.8010.37"
          IMAGE="uazo/chromium:${VERSION}"

          mkdir -p "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/cromite-source"
          git clone --depth 1 https://github.com/uazo/cromite.git "$GITHUB_WORKSPACE/cromite-source"

          # Restore Chromium's normal Android MediaDrm path by removing only
          # Cromite's patch that disables MediaDrm preprovisioning.
          sed -i '/^Disable-DRM-media-origin-IDs-preprovisioning\.patch$/d' \
            "$GITHUB_WORKSPACE/cromite-source/build/cromite_patches_list.txt"

          docker pull "$IMAGE"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/cromite-source:/home/lg/working_dir/cromite" \
            -v "$GITHUB_WORKSPACE/artifacts:/output" \
            "$IMAGE" bash -lc '
              set -eo pipefail

              export WORKSPACE=/home/lg/working_dir
              export HOME=/home/lg/working_dir
              export TARGET_ISDEBUG=true
              export TARGET_OS=android
              export DEPOT_TOOLS=/home/lg/depot_tools

              # The Cromite build image does not contain depot_tools, so install
              # the official Chromium depot_tools checkout inside the container.
              if [ ! -d "$DEPOT_TOOLS/.git" ]; then
                rm -rf "$DEPOT_TOOLS"
                git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
              fi

              export PATH="$DEPOT_TOOLS:$WORKSPACE/chromium/src/third_party/llvm-build/Release+Asserts/bin:/usr/local/go/bin:/home/lg/mtool:$PATH"

              # Bootstrap depot_tools Python when this checkout has not yet been
              # initialized. Different depot_tools revisions expose different
              # bootstrap entry points, so try the supported entry points in order.
              if [ ! -f "$DEPOT_TOOLS/python3_bin_reldir.txt" ]; then
                if [ -x "$DEPOT_TOOLS/ensure_bootstrap" ]; then
                  "$DEPOT_TOOLS/ensure_bootstrap"
                elif [ -x "$DEPOT_TOOLS/bootstrap" ]; then
                  "$DEPOT_TOOLS/bootstrap"
                elif [ -x "$DEPOT_TOOLS/update_depot_tools" ]; then
                  "$DEPOT_TOOLS/update_depot_tools"
                else
                  echo "depot_tools was cloned but no bootstrap entry point was found" >&2
                  ls -la "$DEPOT_TOOLS" >&2
                  exit 1
                fi
              fi

              test -f "$DEPOT_TOOLS/python3_bin_reldir.txt"
              PYTHON3="$DEPOT_TOOLS/python3"
              if [ ! -x "$PYTHON3" ]; then
                PY_REL="$(cat "$DEPOT_TOOLS/python3_bin_reldir.txt")"
                PYTHON3="$DEPOT_TOOLS/$PY_REL"
              fi
              test -x "$PYTHON3"
              "$PYTHON3" --version
              "$DEPOT_TOOLS/gn" --version

              cd "$WORKSPACE"
              git -C chromium/src config user.email "drm-build@example.invalid"
              git -C chromium/src config user.name "Cromite DRM Build"

              bash "$WORKSPACE/cromite/tools/images/cromite-source/apply-cromite-patches.sh"

              cd "$WORKSPACE/chromium/src"

              # Verify the Cromite MediaDrm disabling feature was not applied.
              if git grep -n "SET_CROMITE_FEATURE_DISABLED(kMediaDrmPreprovisioning)" -- .; then
                echo "DRM disabling patch is still present" >&2
                exit 1
              fi

              rm -rf out/arm64_drm
              "$DEPOT_TOOLS/gn" gen --args="target_os = \"android\" target_cpu = \"arm64\" $(cat ../../cromite/build/cromite.gn_args)" out/arm64_drm

              "$PYTHON3" "$DEPOT_TOOLS/siso.py" ninja -C out/arm64_drm chrome_public_bundle --offline
              "$PYTHON3" "$DEPOT_TOOLS/siso.py" ninja -C out/arm64_drm chrome_public_apk --offline

              APK="out/arm64_drm/apks/ChromePublic.apk"
              test -f "$APK"
              cp "$APK" /output/Cromite-ARM64-DRM-debug.apk
              cp ../../cromite/build/RELEASE /output/Cromite-version.txt
              git rev-parse HEAD > /output/Cromite-source-revision.txt
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cromite-ARM64-DRM
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
